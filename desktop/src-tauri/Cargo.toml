[package]
name = "calculated-live-desktop"
version = "0.1.0"
description = "Playout by simulcast.stream — pack MP4 and go live on Cloudflare"
authors = ["simulcast.stream"]
edition = "2021"

[lib]
name = "calculated_live_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
tokio = { version = "1", features = ["macros", "process", "fs", "io-util", "net", "time", "sync", "rt"] }
sha2 = "0.10"
hmac = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hostname = "0.4"
dirs = "6"
rfd = "0.15"
walkdir = "2"
urlencoding = "2"
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
